
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 11.6</title>
</head>
<body>

    <h1>Comparación de cadenas</h1>

    <form onsubmit="comparar(event)">

        <label>Primera cadena:</label>
        <input type="text" id="cadena1" required>

        <br><br>

        <label>Segunda cadena:</label>
        <input type="text" id="cadena2" required>

        <br><br>

        <button type="submit">Comparar</button>

    </form>

    <h3 id="resultado"></h3>

    <script>

        function comparar(event) {
            event.preventDefault();

            let str1 = document.getElementById("cadena1").value;
            let str2 = document.getElementById("cadena2").value;

            if (str1 < str2) {
                document.getElementById("resultado").innerHTML =
                    "La primera cadena es menor que la segunda.";
            }
            else if (str1 > str2) {
                document.getElementById("resultado").innerHTML =
                    "La primera cadena es mayor que la segunda.";
            }
            else if (str1 === str2) {
                document.getElementById("resultado").innerHTML =
                    "Las dos cadenas son iguales.";
            }
        }

    </script>

</body>
</html>
