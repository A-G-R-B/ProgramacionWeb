
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Salarios por Comisión</title>
</head>
<body>

    <h1>Calculadora de Salarios</h1>

    <h3>Ingrese las ventas brutas del empleado:</h3>

    <form id="formulario">
        <label>Ventas brutas ($):</label>
        <input type="number" id="ventas" min="0" step="0.01" required>

        <button type="submit">Calcular salario</button>
    </form>

    <h3 id="resultado"></h3>

    <h2>Contador de vendedores por salario</h2>

    <div id="rangos"></div>

    <script>

        // Arreglo para contar los vendedores
        let contadores = [0, 0, 0, 0, 0, 0, 0, 0, 0];

        // Rangos de salarios
        let nombres = [
            "$200 - $299",
            "$300 - $399",
            "$400 - $499",
            "$500 - $599",
            "$600 - $699",
            "$700 - $799",
            "$800 - $899",
            "$900 - $999",
            "$1000 o más"
        ];

        document.getElementById("formulario").onsubmit = function(event) {
            event.preventDefault();

            // Obtener las ventas del empleado
            let ventas = Number(document.getElementById("ventas").value);

            // Calcular el salario y truncarlo
            let salario = Math.trunc(200 + ventas * 0.09);

            // Determinar el rango salarial
            let indice = Math.min(
                Math.floor((salario - 200) / 100), 8
            );

            // Aumentar el contador correspondiente
            contadores[indice]++;

            // Mostrar el salario
            document.getElementById("resultado").innerHTML =
                "Salario del empleado: $" + salario;

            // Mostrar los contadores
            mostrarContadores();

            // Limpiar el formulario
            document.getElementById("ventas").value = "";
        };

        function mostrarContadores() {

            let texto = "";

            for (let i = 0; i < contadores.length; i++) {
                texto += nombres[i] + ": " +
                         contadores[i] + " vendedores<br>";
            }

            document.getElementById("rangos").innerHTML = texto;
        }

        // Mostrar los contadores iniciales
        mostrarContadores();

    </script>

</body>
</html>
